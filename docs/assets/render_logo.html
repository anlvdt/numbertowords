<!DOCTYPE html>
<html>
<head><title>Render Logo</title></head>
<body>
<p>Rendering and downloading logos...</p>
<script>
  const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#37B24D" /><text x="50%" y="54%" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="88" font-weight="800" fill="white" text-anchor="middle" dominant-baseline="central">₫</text></svg>`;
  const sizes = [16, 32, 64, 80, 128];
  
  function render(size, delay) {
    setTimeout(() => {
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, size, size);
        const a = document.createElement('a');
        a.download = `icon-${size}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
    }, delay);
  }

  sizes.forEach((s, i) => render(s, i * 500));
</script>
</body>
</html>
